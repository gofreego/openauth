apiVersion: apps/v1
kind: Deployment
metadata:
  name: openauth
  labels:
    app: openauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openauth
  template:
    metadata:
      labels:
        app: openauth
    spec:
      containers:
        - name: openauth
          image: ghcr.io/gofreego/openauth:pilot-38575e1
          imagePullPolicy: Always
          command:
            - /app/application
          args:
            - -env=prod
            - -path=/etc/openauth/config
          ports:
            - name: http
              containerPort: 80
            - name: grpc
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /etc/openauth/config
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          secret:
            # Created out-of-band from the private configs-prod repo, not by
            # anything in this repo's own manifests - see infra's
            # openauth-config-secret role.
            secretName: openauth-config
