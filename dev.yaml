LogConfig: true
Logger:
  AppName: openauth
  Build: dev
  Level: debug
AppNames:
- HTTP_SERVER
- GRPC_SERVER
Server:
  HTTP:
    Port: 80
    AuthenticationEnabled: true
  GRPC:
    Port: 8081
    AuthenticationEnabled: true
Repository:
  Name: Postgres
  Postgres:
    primary:
      Host: 192.168.1.100
      Port: 5432
      Username: "admin"
      Password: OSwfiTlc1r5W7Z
      DBName: openauth
      SSLMode: "disable"
      MaxOpenConns: 0
      MaxIdleConns: 0
      ConnMaxLifetime: 0s
      ConnMaxIdleTime: 0s
    replica: []
Service:
  JWT:
    # JWT secret key for token signing - MUST be changed in production
    # Should be at least 32 characters long for HS256 algorithm
    SecretKey: d550d9f6c49b0470abda464e50a14d87 # Updated secret key for consistency
    AccessTokenTTL: "168h"   # Access token expiration time (7 seconds)
    RefreshTokenTTL: "168h"   # Refresh token expiration time in hours (7 days)
  Security:
    BcryptCost: 12         # Password hashing cost (higher = more secure but slower)
    MaxLoginAttempts: 5    # Maximum failed login attempts before account lockout
    LockoutDuration: "30m" # Account lockout duration after max failed attempts
  Mediabase:
    ServiceEndpoint: mediabase.zshala-com.svc.cluster.local:8081
    BucketName: openauth
  GoogleOAuth:
    # OAuth client ID(s) accepted as the ID token audience — put the
    # "serverClientId" the zshala app is configured with here (see
    # zshala's GOOGLE_SERVER_CLIENT_ID dart-define). Get this from
    # Google Cloud Console > APIs & Services > Credentials.
    ClientIDs:
      - "4903461670-il0prefibm7ujos51c4efc5ft2s2lu6a.apps.googleusercontent.com"
Debug:
  Enabled: true
  EnablePprof: true